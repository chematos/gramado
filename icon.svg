<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0b0f14"/>
  <!-- Sky gradient layer -->
  <rect width="512" height="320" fill="#0d1520" y="0"/>

  <!-- Stars -->
  <circle cx="80"  cy="70"  r="3" fill="#fbbf24" opacity=".9"/>
  <circle cx="160" cy="50"  r="2" fill="#e8f0fa" opacity=".7"/>
  <circle cx="290" cy="40"  r="2.5" fill="#fbbf24" opacity=".8"/>
  <circle cx="400" cy="65"  r="2" fill="#e8f0fa" opacity=".6"/>
  <circle cx="450" cy="90"  r="3" fill="#fbbf24" opacity=".7"/>
  <circle cx="50"  cy="120" r="1.5" fill="#e8f0fa" opacity=".5"/>
  <circle cx="340" cy="100" r="1.5" fill="#e8f0fa" opacity=".6"/>

  <!-- Back mountain (darker) -->
  <polygon points="20,340 180,130 340,340" fill="#0f3d2a" opacity=".9"/>
  <!-- Front mountain left -->
  <polygon points="0,340 140,160 280,340"  fill="#1f9d6a" opacity=".85"/>
  <!-- Front mountain right -->
  <polygon points="230,340 370,180 512,340" fill="#17845a" opacity=".9"/>
  <!-- Snow caps -->
  <polygon points="140,160 158,200 122,200" fill="#e8f0fa" opacity=".7"/>
  <polygon points="180,130 196,168 164,168" fill="#e8f0fa" opacity=".5"/>
  <polygon points="370,180 385,216 355,216" fill="#e8f0fa" opacity=".6"/>

  <!-- Ground -->
  <rect x="0" y="338" width="512" height="174" fill="#0b1a10"/>

  <!-- Text: GRAMADO -->
  <text x="256" y="430" font-family="system-ui,-apple-system,sans-serif"
        font-size="80" font-weight="900" fill="#fbbf24"
        text-anchor="middle" letter-spacing="2">GRAMADO</text>

  <!-- Text: Semana Santa 2026 -->
  <text x="256" y="482" font-family="system-ui,-apple-system,sans-serif"
        font-size="34" font-weight="500" fill="#9fb0c3"
        text-anchor="middle" letter-spacing="1">Semana Santa 2026</text>
</svg>
